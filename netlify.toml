[build]
  command = "npm run build"
  publish = "dist"
[functions]
  node_bundler = "esbuild"
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth?action=:splat"
  status = 200
[[redirects]]
  from = "/api/data/*"
  to = "/.netlify/functions/data?path=:splat"
  status = 200
[[redirects]]
  from = "/api/openrouter/models"
  to = "/.netlify/functions/openrouter"
  status = 200
[[redirects]]
  from = "/api/openrouter/stream"
  to = "/.netlify/functions/openrouter"
  status = 200
[[redirects]]
  from = "/api/admin/overview"
  to = "/.netlify/functions/admin"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
