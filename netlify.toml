[build]
  command = "npm run build"
  publish = "dist"
[functions]
  node_bundler = "esbuild"
[[redirects]]
  from = "/api/openrouter/stream"
  to = "/.netlify/functions/openrouter"
  status = 200
[[redirects]]
  from = "/api/admin/overview"
  to = "/.netlify/functions/admin"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
